services:
  postgres-db:
    image: postgres:15-alpine
    container_name: fleet_postgres_dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: fleet_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d fleet_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: fleet_redis_dev
    ports:
      - '6379:6379'
    networks:
      - fleet-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  fleet-network:
    driver: bridge
